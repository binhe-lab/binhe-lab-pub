<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8"/>

  <title>{{ page.title }}</title>

  <!-- Mobile Responsive -->

  <!-- RSS feed -->
  <link rel="alternate" type="application/rss+xml" title="{{ site.name }}" href="{{ site.url }}/feed.xml">

  <!-- Font Awesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet" media="screen">
  
  <!-- Custom Styles -->
  <link href="/css/style.css" rel="stylesheet" media="screen">

  <!-- Academicons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/academicons/1.8.1/css/academicons.min.css" media="screen"/>

  <!-- Favicon -->
  <link rel="shortcut icon" href="/images/logo.png"/>

<body>

  <!-- use navbar-inverse bg-inverse to color the background 15 sep 2017 -->
  <nav class="navbar navbar-inverse navbar-static-top bg-inverse" role="navigation" aria-label="Primary navigation">
  <div class="container">
    <!-- Brand name, brand logo and toggle get grouped for better mobile display -->
    <div class="navbar-header">
      <!-- restore to bedford.io version
      <div class="navbar-brand">
      {% if page.categories.first != 'home' %} 
        <a href="/"><img class="navbar-brand-logo" src="/images/logo.png" /></a>
      {% endif %}
      </div> -->
      <button type="button" class="navbar-toggle" data-toggle="collapse" data-target="#navbar-menu-collapse" aria-controls="navbar-menu-collapse" aria-expanded="false">
        <span class="sr-only">Toggle navigation</span>
        <span class="icon-bar"></span>
        <span class="icon-bar"></span>
        <span class="icon-bar"></span>
      </button>
      <a class="navbar-brand-text" href="/">Gene Regulatory Evolution</a>
    </div>

    <!-- Collect the nav links, forms, and other content for toggling -->
    <div class="collapse navbar-collapse" id="navbar-menu-collapse">
      <ul class="nav navbar-nav navbar-right text-right">
        <li{% if page.categories.first == 'research' %} class="active"{% endif %}>
          <a href="/research/"{% if page.categories.first == 'research' %} aria-current="page"{% endif %}>Research</a>
        </li>
        <li{% if page.categories.first == 'papers' %} class="active"{% endif %}>
          <a href="/papers/"{% if page.categories.first == 'papers' %} aria-current="page"{% endif %}>Papers</a>
        </li>
        <li{% if page.categories.first == 'members' %} class="active"{% endif %}>
          <a href="/members/"{% if page.categories.first == 'members' %} aria-current="page"{% endif %}>Team / Join</a>
        </li>
        <li{% if page.categories.first == 'news' %} class="active"{% endif %}>
          <a href="/news/"{% if page.categories.first == 'news' %} aria-current="page"{% endif %}>News</a>
        </li>
        <li{% if page.categories.first == 'links' %} class="active"{% endif %}>
          <a href="/misc/links/"{% if page.categories.first == 'links' %} aria-current="page"{% endif %}>Links</a>
        </li>
      </ul>
    </div><!-- /.navbar-collapse -->
  <!-- </div> /.col-md-10 --> 
  </div><!-- /.container -->
  </nav>

  <div class="container">
    {{ content }}
  </div>

    </div>
  </footer>
